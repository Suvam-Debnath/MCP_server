spring:
  application:
    name: mcp-app

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma:2b
          temperature: 0.7
    mcp:
      client:
        stdio:
          servers-configuration: classpath:servers.json

server:
  port: 8081

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG